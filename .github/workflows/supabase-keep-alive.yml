name: Supabase Keep Alive

on:
  schedule:
    - cron: "30 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: Check Supabase projects
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Supabase Project 1
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_1_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROJECT_1_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo "::error::Project 1 URL or key is missing."
            exit 1
          fi

          attempt=1
          max_attempts=5
          until curl \
            --silent \
            --show-error \
            --fail-with-body \
            --ipv4 \
            --connect-timeout 15 \
            --max-time 45 \
            --header "apikey: $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/keep_alive?select=id&limit=1"
          do
            if [[ $attempt -ge $max_attempts ]]; then
              echo "::error::Project 1 did not respond after $attempt attempts."
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 5 seconds..."
            attempt=$((attempt + 1))
            sleep 5
          done

          echo
          echo "Project 1 responded successfully."

      - name: Check Supabase Project 2
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_2_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROJECT_2_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo "::error::Project 2 URL or key is missing."
            exit 1
          fi

          attempt=1
          max_attempts=5
          until curl \
            --silent \
            --show-error \
            --fail-with-body \
            --ipv4 \
            --connect-timeout 15 \
            --max-time 45 \
            --header "apikey: $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/keep_alive?select=id&limit=1"
          do
            if [[ $attempt -ge $max_attempts ]]; then
              echo "::error::Project 2 did not respond after $attempt attempts."
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 5 seconds..."
            attempt=$((attempt + 1))
            sleep 5
          done

          echo
          echo "Project 2 responded successfully."

      - name: Check Supabase Project 3
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_3_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROJECT_3_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo "::error::Project 3 URL or key is missing."
            exit 1
          fi

          attempt=1
          max_attempts=5
          until curl \
            --silent \
            --show-error \
            --fail-with-body \
            --ipv4 \
            --connect-timeout 15 \
            --max-time 45 \
            --header "apikey: $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/keep_alive?select=id&limit=1"
          do
            if [[ $attempt -ge $max_attempts ]]; then
              echo "::error::Project 3 did not respond after $attempt attempts."
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 5 seconds..."
            attempt=$((attempt + 1))
            sleep 5
          done

          echo
          echo "Project 3 responded successfully."
